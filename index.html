<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>放映线路编排台</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">纸质放映胶片调度</p>
          <h1>放映线路编排台</h1>
        </div>
        <div class="hero-stats">
          <div>
            <span>未结束卷</span>
            <strong id="statUnfinished">0</strong>
          </div>
          <div>
            <span>缺盒冻结</span>
            <strong id="statFrozen">0</strong>
          </div>
          <div>
            <span>片段总数</span>
            <strong id="statSegments">0</strong>
          </div>
        </div>
      </header>

      <div id="notice" class="notice" hidden></div>

      <section class="config-grid">
        <div class="panel">
          <div class="panel-head">
            <h2>预置线路</h2>
            <span>三条线路 · 件数上限</span>
          </div>
          <div id="lineCards" class="line-cards"></div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h2>预置片盒</h2>
            <span>五种片盒 · 库存可调，调低不得低于占用</span>
          </div>
          <div id="boxRows" class="box-rows"></div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h2>每卷片段规格</h2>
            <span>改动后重算全部未结束卷</span>
          </div>
          <form id="specForm" class="spec-form">
            <label>
              单卷片段上限
              <input id="specMaxSegments" type="number" min="1" step="1" />
            </label>
            <label>
              单卷总时长上限（秒）
              <input id="specMaxDuration" type="number" min="1" step="1" />
            </label>
            <button class="primary" type="submit">应用规格并重算</button>
            <p id="specHint" class="form-hint"></p>
          </form>
        </div>
      </section>

      <section class="board-grid">
        <div class="panel open-panel">
          <h2>开卷登记</h2>
          <form id="openForm" class="open-form">
            <label>
              胶片卷题名
              <input id="openTitle" type="text" required placeholder="例：春日试映B卷" />
            </label>
            <label>
              放映线路
              <select id="openLine"></select>
            </label>
            <div class="open-boxes">
              <span class="form-label">登记片盒数量</span>
              <div id="openBoxRows" class="open-box-rows"></div>
            </div>
            <button class="primary" type="submit">开卷</button>
            <p class="form-hint">
              片盒被其他未结束卷占用、或线路件数达上限时整卷拒绝且排序不变；需求量超过总库存的缺盒卷登记后冻结，片盒到位可恢复。
            </p>
          </form>
        </div>

        <div class="panel board-panel">
          <div class="panel-head">
            <h2>线路编排</h2>
            <span>点选卡片切换当前卷，再到下方编排片段</span>
          </div>
          <div id="reelBoard" class="reel-board"></div>
          <h3 class="archive-head">存档（已停映 / 已撤销，资源已释放）</h3>
          <div id="archiveList" class="archive-list"></div>
        </div>
      </section>

      <section class="toolbar">
        <label>
          当前卷题名
          <input id="reelTitle" type="text" placeholder="先在上方开卷或点选一卷" />
        </label>
        <label>
          颜色偏移
          <select id="colorFilter">
            <option value="all">全部</option>
            <option value="正常">正常</option>
            <option value="偏红">偏红</option>
            <option value="偏青">偏青</option>
            <option value="偏黄">偏黄</option>
            <option value="褪色">褪色</option>
          </select>
        </label>
        <label>
          搜索
          <input id="searchInput" type="search" placeholder="片段编号或备注" />
        </label>
        <button id="exportBtn">导出排期</button>
      </section>

      <section class="layout">
        <aside class="panel">
          <h2>录入片段</h2>
          <form id="segmentForm" class="segment-form">
            <fieldset id="segmentFields" class="flat">
              <label>
                片段编号
                <input id="codeInput" required placeholder="A-014" />
              </label>
              <label>
                时长秒数
                <input id="durationInput" required type="number" min="1" value="12" />
              </label>
              <label>
                颜色偏移
                <select id="shiftInput">
                  <option value="正常">正常</option>
                  <option value="偏红">偏红</option>
                  <option value="偏青">偏青</option>
                  <option value="偏黄">偏黄</option>
                  <option value="褪色">褪色</option>
                </select>
              </label>
              <label>
                破损情况
                <select id="damageInput">
                  <option value="完好">完好</option>
                  <option value="轻微划痕">轻微划痕</option>
                  <option value="齿孔破损">齿孔破损</option>
                  <option value="接片松动">接片松动</option>
                  <option value="需跳过">需跳过</option>
                </select>
              </label>
              <label>
                缩略图
                <input id="thumbInput" type="file" accept="image/*" />
              </label>
              <label>
                备注
                <textarea id="noteInput" rows="4" placeholder="试映前要留意的画面、接片或声音点"></textarea>
              </label>
              <button class="primary" type="submit">加入放映清单</button>
            </fieldset>
          </form>
        </aside>

        <section class="panel list-panel">
          <div class="panel-head">
            <h2>放映顺序</h2>
            <span id="listSub">拖拽片段调整顺序</span>
          </div>
          <div id="segmentList" class="segment-list"></div>
        </section>

        <aside class="panel warning-panel">
          <h2>试映前核对</h2>
          <div id="warningList" class="warning-list"></div>
        </aside>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
